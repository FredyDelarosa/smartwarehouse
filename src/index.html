<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>SmartWarehouse — Gestión de almacén</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Localización y control de productos en almacén: búsqueda instantánea de ubicaciones, inventario, movimientos e incidencias."
    />
    <meta name="theme-color" content="#002F6C" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- PWA: el manifest es lo que habilita "Añadir a pantalla de inicio". -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="application-name" content="SmartWarehouse" />
    <!--
      iOS no lee el manifest: sin esto, "Añadir a pantalla de inicio" en Safari
      guarda una página web normal, sin icono propio y sin standalone.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartWarehouse" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        SmartWarehouse necesita JavaScript activado para funcionar.
      </p>
    </noscript>
  </body>
</html>
