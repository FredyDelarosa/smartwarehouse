<!--
  Icono de SmartWarehouse.

  Por qué SVG y no un PNG desenhado a mano: el mismo archivo genera los PNG
  que exige el manifest (192, 512 y el maskable de 512) sin duplicar el
  diseño. Se regenera con:

      npx tsx scripts/generar-iconos.ts

  Trazo: una caja (el almacén) con una baliza de localización encima. El
  "pin" con degradado es el elemento reconocible de la marca.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#002F6C" />
      <stop offset="1" stop-color="#001F47" />
    </linearGradient>
    <linearGradient id="pin" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fondo)" />

  <!-- Estantería: dos pisos con tres huecos cada uno. -->
  <g fill="#e2e8f0" opacity="0.9">
    <rect x="96" y="300" width="320" height="26" rx="8" />
    <rect x="96" y="388" width="320" height="26" rx="8" />
    <rect x="96" y="212" width="320" height="26" rx="8" />
  </g>
  <g fill="#94a3b8">
    <rect x="120" y="336" width="72" height="52" rx="7" />
    <rect x="212" y="336" width="72" height="52" rx="7" />
    <rect x="304" y="336" width="72" height="52" rx="7" />
    <rect x="120" y="424" width="72" height="52" rx="7" />
    <rect x="212" y="424" width="72" height="52" rx="7" />
    <rect x="304" y="424" width="72" height="52" rx="7" />
  </g>

  <!-- Baliza de localización. -->
  <path
    d="M256 56c-52 0-94 42-94 94 0 68 94 138 94 138s94-70 94-138c0-52-42-94-94-94z"
    fill="url(#pin)"
  />
  <circle cx="256" cy="150" r="36" fill="#0f172a" opacity="0.85" />
</svg>